name: Build iOS

# Reusable workflow: unsigned iOS release build packaged as an .ipa. Called from ci.yml.
on:
  workflow_call:
    inputs:
      flutter-version:
        description: Flutter SDK version to install.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --dart-define-from-file=env.json --obfuscate --split-debug-info=build/symbols
      # Wrap the .app in an .ipa. It is unsigned, so it must be re-signed with your own
      # Apple ID or provisioning profile (e.g. Sideloadly, AltStore) before it will install.
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry Runner-unsigned.ipa Payload

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ipa-unsigned-${{ github.sha }}
          path: build/ipa/Runner-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
