name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow token can only read the repo.
# Called workflows cannot exceed these permissions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs inside each called workflow.
# Dependabot updates them. Top-level `env` is not visible to called workflows,
# so the Flutter version is passed as an explicit input instead.
jobs:
  # Runs on every push to main, every pull request, and manual dispatch.
  test:
    uses: ./.github/workflows/test.yml
    with:
      flutter-version: "3.47.6"

  # Builds only run on main (push, or manual dispatch from main) once tests pass.
  build-android:
    needs: test
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-android.yml
    with:
      flutter-version: "3.47.6"

  build-ios:
    needs: test
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-ios.yml
    with:
      flutter-version: "3.47.6"
